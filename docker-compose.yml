services:
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"

  api-backend:
    image: nginx:alpine
    ports:
      - "8081:80"

  rate-limiter:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_REDIS_HOST=redis
      - RATE_LIMITER_API_SERVER_URL=http://api-backend:80
    depends_on:
      - redis
      - api-backend

  tollgate-ui:
    build: ./tollgate-ui
    ports:
      - "3000:80"
    depends_on:
      - rate-limiter
